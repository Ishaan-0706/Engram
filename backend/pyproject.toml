[project]
name = "company-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "mcp>=1.2,<2",
    "fastapi>=0.115",
]

[tool.setuptools.packages.find]
include = ["app*", "engram_graph_core*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
graph = ["falkordb>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: talks to local FalkorDB"]
